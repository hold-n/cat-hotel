<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- House body -->
  <rect x="20" y="45" width="60" height="45" rx="4" fill="#f5ebe0"/>
  <!-- Roof -->
  <polygon points="10,50 50,15 90,50" fill="#5b21b6"/>
  <!-- Door -->
  <rect x="40" y="60" width="20" height="30" rx="10" fill="#f5ebe0"/>
  <!-- Cat ears on roof -->
  <polygon points="35,35 42,20 49,35" fill="#5b21b6"/>
  <polygon points="51,35 58,20 65,35" fill="#5b21b6"/>
  <!-- Cat face in door (simple) -->
  <circle cx="45" cy="72" r="2" fill="#5b21b6"/>
  <circle cx="55" cy="72" r="2" fill="#5b21b6"/>
  <ellipse cx="50" cy="77" rx="2" ry="1.5" fill="#c2410c"/>
  <!-- Whiskers -->
  <line x1="38" y1="75" x2="46" y2="76" stroke="#5b21b6" stroke-width="1"/>
  <line x1="38" y1="78" x2="46" y2="78" stroke="#5b21b6" stroke-width="1"/>
  <line x1="54" y1="76" x2="62" y2="75" stroke="#5b21b6" stroke-width="1"/>
  <line x1="54" y1="78" x2="62" y2="78" stroke="#5b21b6" stroke-width="1"/>
</svg>
